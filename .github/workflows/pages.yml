name: Build and deploy

# Ported from the pre-split build-and-deploy.yml so that what the public site
# runs is exactly what it ran before. Do not edit this file in the public
# repository -- it is overwritten on every publish. Edit
# .publish/overlay/.github/workflows/pages.yml in dsmlp-docs-dev.
#
# MkDocs with a bespoke theme carrying the UC San Diego Decorator 5 chrome.
# Runs on Actions rather than the built-in GitHub Pages builder, which only
# builds Jekyll and cannot run the Node-based chrome integrity gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # --strict turns MkDocs' link and anchor validation into build failures.
      # The content is densely cross-linked with relative .md links and
      # anchors, so this is the main guard against a rename stranding pages.
      - name: Build (strict)
        run: mkdocs build --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Decorator chrome integrity gate. Tier 1 catches a page whose chrome
      # drifted, tier 3 a structural break, tier 4 site CSS or JS reaching
      # into the shell.
      #
      # continue-on-error is ONLY because no golden baseline has been recorded
      # yet (tier 2). A human reviews the rendered chrome once, runs
      #   node checks/chrome-contract.mjs --accept --reason "initial baseline"
      # from the built _site, commits chrome-contract.local.json, then removes
      # this line. Never run --accept from CI or from an agent: it overwrites
      # the record that anything changed.
      - name: Decorator chrome integrity gate
        continue-on-error: true
        working-directory: _site
        run: npx -y github:UCSD/decorator-kit verify

      - name: Check built HTML for dead links and anchors
        run: python3 tools/check-links.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
